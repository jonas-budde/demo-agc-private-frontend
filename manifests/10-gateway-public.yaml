apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-public
  namespace: demo
  annotations:
    alb.networking.azure.io/alb-id: AGC_ID
spec:
  gatewayClassName: azure-alb-external
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: Same }
  addresses:
    - type: alb.networking.azure.io/alb-frontend
      value: fe-public
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-public
  namespace: demo
spec:
  parentRefs:
    - name: gw-public
  rules:
    - backendRefs:
        - name: echo
          port: 80
